repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.1
    hooks:
      # Run the linter.
      - id: ruff-check
      - id: ruff-format
  # - repo: https://github.com/facebook/pyrefly-pre-commit
  #   rev: 1.4.0  # Note: this is the version of the pre-commit hook, NOT the pyrefly version used for type checking
  #   hooks:
  #     - id: pyrefly-check
  #       name: Pyrefly (type checking)
  #       pass_filenames: false  # Recommended to do full repo checks. However, you can change this to `true` to only check changed files
  #       language: system  # Use system-installed pyrefly
  - repo: local
    hooks:
      - id: pyrefly-check
        name: Pyrefly (type checking)
        entry: ./.venv/bin/pyrefly check
        pass_filenames: false  # Recommended to do full repo checks. However, you can change this to `true` to only check changed files
        language: system  # Use system-installed pyrefly
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: ./.venv/bin/pytest tests
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.13.1
    hooks:
      - id: uv-lock
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages: [pre-push]
